name: tests

# main contains only the skeleton (stubs), so tests there are red by design.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches-ignore: [main]

jobs:
  level:
    # A separate check per level: you can see at a glance which ones are green.
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: MutexTest
            stress: mutex
          - test: OneShotLatchTest
            stress: latch
          - test: SimpleSemaphoreTest
            stress: semaphore
          - test: SimpleReentrantLockTest
            stress: reentrant
          - test: SimpleReadWriteLockTest
            stress: rwlock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: JUnit
        run: ./mvnw -B -pl core test -Dtest=${{ matrix.test }}

      - name: Build jcstress jar
        run: ./mvnw -B -pl stress -am package -DskipTests

      - name: jcstress (sanity)
        run: |
          java -jar stress/target/jcstress.jar -t aqs.practice.stress.${{ matrix.stress }} -m sanity | tee jcstress.log
          # jcstress does not change the exit code on failures, so we check the summary in the log
          grep -q "Failed tests: No matches" jcstress.log
          grep -q "Error tests: No matches" jcstress.log
